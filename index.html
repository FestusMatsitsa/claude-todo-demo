<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<meta name="description" content="A clean, fast to-do list that saves in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230e8a96'/><path d='M28 52l16 16 28-32' fill='none' stroke='white' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #eef3f4;
    --surface: #ffffff;
    --surface-2: #f5f8f9;
    --ink: #0f2f38;
    --ink-soft: #55717a;
    --line: #dbe5e8;
    --accent: #0e8a96;
    --accent-ink: #ffffff;
    --accent-wash: #dff1f3;
    --high: #e5574a;
    --med: #e09a1f;
    --low: #4c9a74;
    --shadow: 0 1px 2px rgba(15, 47, 56, .06), 0 12px 32px -12px rgba(15, 47, 56, .18);
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  :root[data-theme="dark"] {
    --bg: #0a1b20;
    --surface: #112a31;
    --surface-2: #0e232a;
    --ink: #e6f1f3;
    --ink-soft: #8fb0b8;
    --line: #1d3c45;
    --accent: #3cc3d0;
    --accent-ink: #062228;
    --accent-wash: #15383f;
    --high: #ff7a6c;
    --med: #f0b246;
    --low: #6cc79c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .app {
    width: min(680px, 100% - 32px);
    margin: 0 auto;
    padding: 48px 0 72px;
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .top-text { min-width: 0; }

  .date {
    margin: 0 0 4px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.1rem);
    letter-spacing: -0.03em;
    line-height: 1.02;
  }

  .summary {
    margin: 10px 0 0;
    color: var(--ink-soft);
  }

  .top-side {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .ring {
    position: relative;
    width: 76px;
    height: 76px;
  }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 7; }
  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 201.06;
    stroke-dashoffset: 201.06;
    transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1);
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
  }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    transition: border-color .15s, background .15s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---------- Add form ---------- */
  .add {
    display: grid;
    gap: 12px;
    padding: 18px;
    border-bottom: 1px solid var(--line);
  }

  .add-row {
    display: flex;
    gap: 10px;
  }

  .add-input {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 16px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-2);
    transition: border-color .15s, background .15s;
  }
  .add-input::placeholder { color: var(--ink-soft); opacity: .8; }
  .add-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }

  .btn-primary {
    height: 48px;
    padding: 0 22px;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    transition: transform .1s ease, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-primary:active { transform: scale(.97); }

  .add-options {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
  }

  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 7px;
    font-size: .875rem;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg label::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dot);
  }
  .seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg .p-low { --dot: var(--low); }
  .seg .p-med { --dot: var(--med); }
  .seg .p-high { --dot: var(--high); }

  .due {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .875rem;
    color: var(--ink-soft);
  }
  .due input {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
  }
  .due input:focus { outline: none; border-color: var(--accent); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }

  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font-size: .9rem;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }
  .tab .n { margin-left: 4px; opacity: .75; font-variant-numeric: tabular-nums; }

  .search {
    position: relative;
    flex: 1;
    min-width: 140px;
    max-width: 220px;
  }
  .search input {
    width: 100%;
    height: 34px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-2);
    font-size: .9rem;
  }
  .search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .search svg {
    position: absolute;
    left: 11px; top: 50%;
    width: 15px; height: 15px;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }

  /* ---------- List ---------- */
  .list { list-style: none; margin: 0; padding: 0; }

  .task {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px 14px 21px;
    border-bottom: 1px solid var(--line);
    transition: background .15s;
  }
  .task:last-child { border-bottom: 0; }
  .task:hover { background: var(--surface-2); }
  .task::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--bar, var(--line));
  }
  .task[data-priority="high"] { --bar: var(--high); }
  .task[data-priority="med"]  { --bar: var(--med); }
  .task[data-priority="low"]  { --bar: var(--low); }
  .task.done::before { opacity: .35; }

  .task.enter { animation: pop .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-6px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .check {
    appearance: none;
    flex-shrink: 0;
    width: 24px; height: 24px;
    margin: 1px 0 0;
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .12s;
  }
  .check:hover { border-color: var(--accent); }
  .check:active { transform: scale(.88); }
  .check::after {
    content: "";
    width: 6px; height: 11px;
    margin-top: -2px;
    border: solid var(--accent-ink);
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) scale(0);
    transition: transform .18s cubic-bezier(.3, 1.5, .5, 1);
  }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { transform: rotate(45deg) scale(1); }

  .body { flex: 1; min-width: 0; }

  .title {
    margin: 0;
    overflow-wrap: anywhere;
    cursor: text;
    transition: color .2s;
  }
  .task.done .title { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-soft) 60%, transparent); }

  .edit-input {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    background: var(--surface);
  }
  .edit-input:focus { outline: none; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 5px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: .8rem;
  }
  .task:hover .chip { background: var(--surface); }
  .chip svg { width: 12px; height: 12px; }
  .chip.overdue { color: var(--high); border-color: color-mix(in srgb, var(--high) 40%, var(--line)); }
  .chip.today { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

  .actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity .15s;
  }
  .task:hover .actions,
  .task:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }

  .act {
    display: grid;
    place-items: center;
    width: 32px; height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-soft);
    transition: background .15s, color .15s;
  }
  .act:hover { background: var(--accent-wash); color: var(--accent); }
  .act.del:hover { background: color-mix(in srgb, var(--high) 14%, transparent); color: var(--high); }
  .act svg { width: 16px; height: 16px; }

  /* ---------- Empty ---------- */
  .empty {
    padding: 48px 24px 52px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty strong {
    display: block;
    margin-bottom: 4px;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 1.2rem;
  }
  .empty svg { width: 44px; height: 44px; margin-bottom: 10px; color: var(--accent); }

  /* ---------- Footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-soft);
    font-size: .9rem;
  }
  .link-btn {
    padding: 4px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    transition: color .15s, background .15s;
  }
  .link-btn:hover:not(:disabled) { color: var(--high); background: color-mix(in srgb, var(--high) 10%, transparent); }
  .link-btn:disabled { opacity: .45; cursor: default; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px 10px 18px;
    border-radius: 12px;
    background: var(--ink);
    color: var(--bg);
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, .4);
    transform: translate(-50%, 24px);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .25s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .toast button {
    padding: 6px 12px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .hint { margin: 18px 0 0; text-align: center; color: var(--ink-soft); font-size: .85rem; }

  @media (max-width: 520px) {
    .app { padding-top: 28px; }
    .ring { width: 60px; height: 60px; }
    .ring-label { font-size: .95rem; }
    .add-row { flex-direction: column; }
    .btn-primary { width: 100%; }
    .search { max-width: none; flex-basis: 100%; order: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<main class="app">
  <header class="top">
    <div class="top-text">
      <p class="date" id="date"></p>
      <h1>Your tasks</h1>
      <p class="summary" id="summary"></p>
    </div>
    <div class="top-side">
      <div class="ring" role="img" id="ringWrap" aria-label="Progress">
        <svg viewBox="0 0 76 76" aria-hidden="true">
          <circle class="ring-track" cx="38" cy="38" r="32"/>
          <circle class="ring-fill" id="ringFill" cx="38" cy="38" r="32"/>
        </svg>
        <div class="ring-label" id="ringLabel">0%</div>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Toggle theme"></button>
    </div>
  </header>

  <section class="card" aria-label="Task list">
    <form class="add" id="addForm" autocomplete="off">
      <div class="add-row">
        <input class="add-input" id="newTitle" type="text" maxlength="200" placeholder="What needs doing?" aria-label="New task" required>
        <button class="btn-primary" type="submit">Add task</button>
      </div>
      <div class="add-options">
        <div class="seg" role="radiogroup" aria-label="Priority">
          <input type="radio" name="priority" id="pLow" value="low">
          <label class="p-low" for="pLow">Low</label>
          <input type="radio" name="priority" id="pMed" value="med" checked>
          <label class="p-med" for="pMed">Medium</label>
          <input type="radio" name="priority" id="pHigh" value="high">
          <label class="p-high" for="pHigh">High</label>
        </div>
        <label class="due">Due <input type="date" id="newDue"></label>
      </div>
    </form>

    <div class="toolbar">
      <div class="tabs" id="tabs" role="group" aria-label="Filter tasks">
        <button class="tab" type="button" data-filter="all" aria-pressed="true">All<span class="n" id="nAll">0</span></button>
        <button class="tab" type="button" data-filter="active" aria-pressed="false">Active<span class="n" id="nActive">0</span></button>
        <button class="tab" type="button" data-filter="done" aria-pressed="false">Done<span class="n" id="nDone">0</span></button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
      </div>
    </div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>

    <div class="foot">
      <span id="left"></span>
      <button class="link-btn" id="clearDone" type="button">Clear completed</button>
    </div>
  </section>

  <p class="hint">Double-click a task to rename it. Your list is saved in this browser.</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">Undo</button>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "tasks.v1";
  var THEME_KEY = "tasks.theme";

  var ICONS = {
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
    done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg>'
  };

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    date: $("date"), summary: $("summary"),
    ringFill: $("ringFill"), ringLabel: $("ringLabel"), ringWrap: $("ringWrap"),
    themeBtn: $("themeBtn"),
    form: $("addForm"), title: $("newTitle"), due: $("newDue"),
    tabs: $("tabs"), search: $("search"),
    list: $("list"), empty: $("empty"),
    nAll: $("nAll"), nActive: $("nActive"), nDone: $("nDone"),
    left: $("left"), clearDone: $("clearDone"),
    toast: $("toast"), toastMsg: $("toastMsg"), toastUndo: $("toastUndo")
  };

  var state = { tasks: load(), filter: "all", query: "", editingId: null, lastDeleted: null, toastTimer: null };

  /* ---------- Storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var data = raw ? JSON.parse(raw) : null;
      if (Array.isArray(data)) return data;
    } catch (e) {}
    return [
      { id: uid(), title: "Try adding your first task above", done: false, priority: "med", due: "", created: Date.now() },
      { id: uid(), title: "Double-click a task to rename it", done: false, priority: "low", due: "", created: Date.now() - 1 }
    ];
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.tasks)); } catch (e) {}
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Dates ---------- */
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function parseLocal(s) {
    var p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function dayDiff(s) {
    var a = parseLocal(s), b = parseLocal(todayStr());
    return Math.round((a - b) / 86400000);
  }
  function dueLabel(s, done) {
    var diff = dayDiff(s);
    var d = parseLocal(s).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    if (diff === 0) return { text: "Today", cls: done ? "" : "today" };
    if (diff === 1) return { text: "Tomorrow", cls: "" };
    if (diff < 0) return { text: done ? d : "Overdue · " + d, cls: done ? "" : "overdue" };
    return { text: d, cls: "" };
  }

  /* ---------- Actions ---------- */
  function addTask(title, priority, due) {
    state.tasks.unshift({ id: uid(), title: title, done: false, priority: priority, due: due, created: Date.now() });
    state.justAdded = state.tasks[0].id;
    save(); render();
  }
  function toggle(id) {
    var t = find(id); if (!t) return;
    t.done = !t.done; save(); render();
  }
  function remove(id) {
    var i = state.tasks.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    state.lastDeleted = { task: state.tasks[i], index: i };
    state.tasks.splice(i, 1);
    save(); render();
    showToast("Task deleted");
  }
  function rename(id, title) {
    var t = find(id); if (!t) return;
    title = title.trim();
    if (title) t.title = title;
    state.editingId = null; save(); render();
  }
  function clearCompleted() {
    var removed = state.tasks.filter(function (t) { return t.done; });
    if (!removed.length) return;
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    state.lastDeleted = { batch: removed };
    save(); render();
    showToast(removed.length + (removed.length === 1 ? " task cleared" : " tasks cleared"));
  }
  function undo() {
    var d = state.lastDeleted; if (!d) return;
    if (d.batch) state.tasks = state.tasks.concat(d.batch).sort(function (a, b) { return b.created - a.created; });
    else state.tasks.splice(d.index, 0, d.task);
    state.lastDeleted = null;
    hideToast(); save(); render();
  }
  function find(id) { return state.tasks.find(function (t) { return t.id === id; }); }

  /* ---------- Toast ---------- */
  function showToast(msg) {
    els.toastMsg.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { els.toast.classList.remove("show"); }

  /* ---------- Render ---------- */
  function visibleTasks() {
    var q = state.query.trim().toLowerCase();
    return state.tasks.filter(function (t) {
      if (state.filter === "active" && t.done) return false;
      if (state.filter === "done" && !t.done) return false;
      if (q && t.title.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function render() {
    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    var active = total - done;
    var pct = total ? Math.round((done / total) * 100) : 0;

    els.nAll.textContent = total;
    els.nActive.textContent = active;
    els.nDone.textContent = done;
    els.ringLabel.textContent = pct + "%";
    els.ringFill.style.strokeDashoffset = 201.06 * (1 - pct / 100);
    els.ringWrap.setAttribute("aria-label", pct + "% of tasks complete");
    els.left.textContent = active + (active === 1 ? " task left" : " tasks left");
    els.clearDone.disabled = done === 0;

    if (!total) els.summary.textContent = "Nothing on your list yet.";
    else if (!active) els.summary.textContent = "All " + total + (total === 1 ? " task" : " tasks") + " complete.";
    else els.summary.textContent = active + (active === 1 ? " task" : " tasks") + " to go, " + done + " done.";

    var items = visibleTasks();
    els.list.textContent = "";
    items.forEach(function (t) { els.list.appendChild(buildItem(t)); });

    renderEmpty(items.length, total);
    state.justAdded = null;

    if (state.editingId) {
      var inp = els.list.querySelector(".edit-input");
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  }

  function renderEmpty(shown, total) {
    if (shown) { els.empty.hidden = true; return; }
    var title, text;
    if (!total) { title = "Your list is clear"; text = "Add a task above to get started."; }
    else if (state.query) { title = "No matches"; text = "Try a different search term."; }
    else if (state.filter === "done") { title = "Nothing completed yet"; text = "Finished tasks will show up here."; }
    else { title = "All caught up"; text = "No active tasks. Add a new one when you're ready."; }
    els.empty.innerHTML = ICONS.done + "<strong></strong><span></span>";
    els.empty.querySelector("strong").textContent = title;
    els.empty.querySelector("span").textContent = text;
    els.empty.hidden = false;
  }

  function buildItem(t) {
    var li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "") + (state.justAdded === t.id ? " enter" : "");
    li.dataset.id = t.id;
    li.dataset.priority = t.priority;

    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done;
    cb.setAttribute("aria-label", (t.done ? "Mark as not done: " : "Mark as done: ") + t.title);
    cb.addEventListener("change", function () { toggle(t.id); });

    var body = document.createElement("div");
    body.className = "body";

    if (state.editingId === t.id) {
      var inp = document.createElement("input");
      inp.type = "text"; inp.className = "edit-input"; inp.value = t.title; inp.maxLength = 200;
      inp.setAttribute("aria-label", "Edit task title");
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") rename(t.id, inp.value);
        else if (e.key === "Escape") { state.editingId = null; render(); }
      });
      inp.addEventListener("blur", function () {
        if (state.editingId === t.id) rename(t.id, inp.value);
      });
      body.appendChild(inp);
    } else {
      var p = document.createElement("p");
      p.className = "title"; p.textContent = t.title;
      p.addEventListener("dblclick", function () { startEdit(t.id); });
      body.appendChild(p);
    }

    if (t.due) {
      var meta = document.createElement("div");
      meta.className = "meta";
      var lbl = dueLabel(t.due, t.done);
      var chip = document.createElement("span");
      chip.className = "chip " + lbl.cls;
      chip.innerHTML = ICONS.cal;
      chip.appendChild(document.createTextNode(lbl.text));
      meta.appendChild(chip);
      body.appendChild(meta);
    }

    var actions = document.createElement("div");
    actions.className = "actions";
    actions.appendChild(actionBtn("act", ICONS.edit, "Edit task", function () { startEdit(t.id); }));
    actions.appendChild(actionBtn("act del", ICONS.trash, "Delete task", function () { remove(t.id); }));

    li.appendChild(cb); li.appendChild(body); li.appendChild(actions);
    return li;
  }

  function actionBtn(cls, icon, label, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = cls; b.innerHTML = icon;
    b.setAttribute("aria-label", label); b.title = label;
    b.addEventListener("click", fn);
    return b;
  }

  function startEdit(id) { state.editingId = id; render(); }

  /* ---------- Theme ---------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    els.themeBtn.innerHTML = theme === "dark" ? ICONS.sun : ICONS.moon;
    els.themeBtn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }

  /* ---------- Events ---------- */
  els.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = els.title.value.trim();
    if (!title) return;
    var priority = els.form.querySelector('input[name="priority"]:checked').value;
    addTask(title, priority, els.due.value);
    els.title.value = ""; els.due.value = "";
    if (state.filter === "done") setFilter("all");
    els.title.focus();
  });

  function setFilter(f) {
    state.filter = f;
    Array.prototype.forEach.call(els.tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.filter === f));
    });
    render();
  }
  els.tabs.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) setFilter(b.dataset.filter);
  });

  els.search.addEventListener("input", function () { state.query = els.search.value; render(); });
  els.clearDone.addEventListener("click", clearCompleted);
  els.toastUndo.addEventListener("click", undo);

  els.themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      e.preventDefault(); els.title.focus();
    }
  });

  /* ---------- Init ---------- */
  els.date.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  initTheme();
  render();
})();
</script>
</body>
</html>
